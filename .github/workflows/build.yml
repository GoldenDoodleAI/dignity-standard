name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-compiled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify compiled packaging is up to date
        run: python3 scripts/build.py --check
